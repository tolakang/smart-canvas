server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Uploads are capped at 50 MB by the API; leave headroom for multipart framing.
  client_max_body_size 51m;

  # Same origin for the SPA and the API, so the session cookie stays first-party.
  # The trailing slash strips the /api prefix (same as the Vite dev proxy).
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
