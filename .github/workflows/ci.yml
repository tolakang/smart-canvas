name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sc
          POSTGRES_PASSWORD: sc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sc" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Integration tests create and drop their own databases through this role.
      TEST_DATABASE_URL: postgres://sc:sc@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Poppler for PDF uploads (D55)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      # The Chromium download is cached per Playwright version: fetching it fresh can take most of the job's time.
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @smart-canvas/worker exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium for the export worker's render tests
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @smart-canvas/worker exec playwright install --with-deps chromium
      - name: Chromium system libraries (browser from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @smart-canvas/worker exec playwright install-deps chromium
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations match the schema
        working-directory: apps/api
        run: |
          DATABASE_URL=unused pnpm db:generate --name ci-drift-check
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "::error::src/db/schema.ts changed without a migration (run pnpm db:generate in apps/api)"
            git status -- drizzle
            exit 1
          fi
      - run: pnpm build

  docker:
    name: Docker images + compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build images (amd64; release builds use docker-bake.hcl for amd64 + arm64)
        run: docker compose build
        env:
          POSTGRES_PASSWORD: ci
          MINIO_ROOT_PASSWORD: ci-password-123
          RENDER_TOKEN: ci-render-token-0123456789abcdef0123
      - name: Start the stack
        run: |
          cp .env.example .env
          sed -i 's/^COOKIE_SECURE=.*/COOKIE_SECURE=false/' .env
          docker compose up -d
      - name: Smoke test through nginx (web → api → postgres + minio)
        run: |
          set -eu
          base=http://localhost:8080/api
          for i in $(seq 1 60); do curl -fsS $base/health && break; sleep 2; done
          curl -fsS $base/health
          jar=$(mktemp)
          code() { curl -s -o /tmp/out -w '%{http_code}' -b "$jar" -c "$jar" "$@"; }
          test "$(code -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"password123","name":"CI","teamName":"CI"}' $base/auth/setup)" = 201
          team=$(curl -fsS -b "$jar" $base/auth/me | python3 -c "import sys,json;print(json.load(sys.stdin)['teams'][0]['id'])")
          test "$(code -F file=@apps/api/src/assets/fixtures/tiny.png $base/teams/$team/assets)" = 201
          asset=$(python3 -c "import json;print(json.load(open('/tmp/out'))['id'])")
          test "$(code $base/teams/$team/assets/$asset/content)" = 200
          cmp /tmp/out apps/api/src/assets/fixtures/tiny.png
          test "$(code -H 'content-type: application/json' -d '{"name":"P"}' $base/teams/$team/projects)" = 201
          project=$(python3 -c "import json;print(json.load(open('/tmp/out'))['id'])")
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = 200
          # Export through the queue: api → pg-boss → worker (Chromium renders http://web/render/…) → MinIO.
          python3 - "$project" > /tmp/put.json <<'PY'
          import json, sys
          p = json.load(open('/tmp/out'))
          doc = p['doc']
          doc['sources'] = [dict(s, content={'kind': 'fill', 'fill': {'type': 'solid', 'color': '#ff0000'}}) if s['id'] == 'background' else s for s in doc['sources']]
          assert doc['schema'] == 3  # D56
          doc['edges'] += [{'id': 'in:background', 'from': 'background', 'to': 'main', 'kind': 'layer'}, {'id': 'out:o1', 'from': 'main', 'to': 'o1', 'kind': 'composition'}]
          doc['compositions'][0]['placements']['background'] = {'x': 0, 'y': 0, 'w': 1, 'h': 1}
          doc['outputs'] = [{'id': 'o1', 'label': 'Smoke', 'size': {'width': 320, 'height': 200, 'unit': 'px'}, 'exportScale': 2, 'family': 'auto', 'overrides': [], 'board': {'x': 420, 'y': 0}}]
          print(json.dumps({'rev': p['rev'], 'doc': doc}))
          PY
          test "$(code -X PUT -H 'content-type: application/json' --data @/tmp/put.json $base/teams/$team/projects/$project)" = 200
          test "$(code -H 'content-type: application/json' -d '{"outputIds":["o1"],"format":"png"}' $base/teams/$team/projects/$project/exports)" = 202
          job=$(python3 -c "import json;print(json.load(open('/tmp/out'))[0]['id'])")
          for i in $(seq 1 60); do
            code "$base/teams/$team/projects/$project/exports?ids=$job" >/dev/null
            status=$(python3 -c "import json;print(json.load(open('/tmp/out'))[0]['status'])")
            [ "$status" = done ] || [ "$status" = failed ] && break
            sleep 2
          done
          cat /tmp/out; echo
          test "$status" = done
          # Download (T6.6): the exported PNG at its export size (320×200 at 2× = 640×400).
          test "$(code $base/teams/$team/exports/$job/file)" = 200
          python3 -c "import struct;d=open('/tmp/out','rb').read();assert d[:8]==b'\\x89PNG\\r\\n\\x1a\\n';w,h=struct.unpack('>II',d[16:24]);print('png',w,h);assert (w,h)==(640,400)"
          echo "stack OK"
      - name: Logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
