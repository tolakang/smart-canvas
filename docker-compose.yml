# Local stack and Dokploy compose. Copy .env.example to .env first.
# Only `web` is published; in Dokploy, attach the domain to service `web`, port 80.
name: smart-canvas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartcanvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smartcanvas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The MinIO image runs as uid 65532 and has no /data, so a new volume starts root-owned.
  minio-init:
    image: busybox:1.37
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - miniodata:/data
    restart: "no"

  minio:
    # MinIO no longer publishes community images to Docker Hub; Chainguard's build of the MinIO
    # server (amd64 + arm64), pinned by digest.
    image: chainguard/minio@sha256:709099319add48dfb44aa596a7070d3ddd8dd04d7ae881765719aec29df9e510
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartcanvas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - miniodata:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

  api:
    build: { context: ., target: api }
    image: ${IMAGE_REGISTRY:-smart-canvas}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smartcanvas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartcanvas}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-smart-canvas}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-smartcanvas}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Read-only access for the export worker (same value as the worker's).
      RENDER_TOKEN: ${RENDER_TOKEN:?set RENDER_TOKEN in .env (32+ characters)}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build: { context: ., target: worker }
    image: ${IMAGE_REGISTRY:-smart-canvas}/worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smartcanvas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-smartcanvas}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-smart-canvas}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-smartcanvas}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Renders through the web app (same fonts and renderer as the preview); reads the API with the render token.
      WEB_URL: http://web
      API_URL: http://api:3000
      RENDER_TOKEN: ${RENDER_TOKEN:?set RENDER_TOKEN in .env (32+ characters)}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: { context: ., target: web }
    image: ${IMAGE_REGISTRY:-smart-canvas}/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
